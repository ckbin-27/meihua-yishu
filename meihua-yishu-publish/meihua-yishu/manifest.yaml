display_name: 梅花易数
description: >-
  梅花易数（邵雍一脉）起卦断卦方法论的总入口。覆盖先天/后天起卦、体用分判、
  五行生克比和断吉凶、应期推算、外应（三要十应）、八卦万物类象、十八占、
  射覆观物、坐端加数等完整体系。当用户要"用时间/数字/所见之物/声音/字画起卦"、
  要"读懂本卦互卦变卦的体用"、要"按五行生克比和断吉凶"、要"定应期/看外应"、
  或要"查八卦万物类象、做射覆观物、用坐端加数"时激活。
